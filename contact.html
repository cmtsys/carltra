<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carl Traberg</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">

<meta name="description" content="Carl Traberg — digital designer">
  </head>
<!-- Yes, I have coded this myself. Have a look around 👀-->

  <body>
    
<div class="page">
<!-- <div id="header"></div> -->

<header>
  <nav class="nav">
    <a href="/" class="">Carl Traberg</a>
    <div class="links" id="nav-links">
      <a href="/">Work</a>
      <a href="/about.html">About</a>
      <a class="active" href="/contact.html">Contact</a>
    </div>

      <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </nav>
</header>

<div class="contact">
  <form id="contact-form" action="https://formspree.io/f/xzdolezd" method="post">
    <input type="hidden" name="_next" value="https://carltra.vercel.app/thanks.html">
    <div class="form-field">
      <label style="font-size: 20px" for="email">How can I help?</label>
      <input style="font-size: 20px" name="Email" id="email" type="email" placeholder="your@email.com">
    </div>
    <div style="font-size: 20px" class="form-field">
      <textarea style="font-size: 20px" name="message" id="message" placeholder="Type here" rows="6"></textarea>
    </div>
    <button type="submit">Send</button>
  </form>
</div>

<!-- <div class="grid" id="grid"></div> -->
<div id="footer"></div>
</div>
  <script>
      const hamburger = document.getElementById('hamburger');
      const navLinks = document.getElementById('nav-links');
    
      hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('open');
        navLinks.classList.toggle('open');
      });
    </script>

<script>
const form = document.getElementById('contact-form');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = new FormData(form);
  const response = await fetch('https://formspree.io/f/xzdolezd', {
    method: 'POST',
    body: data,
    headers: { 'Accept': 'application/json' }
  });
  if (response.ok) {
    window.location.href = '/thanks.html';
  } else {
    alert('Something went wrong, please try again.');
  }
});
</script>

      <script src="js/typewriter.js"></script>
      <script src="js/projects.js"></script>
      <script src="js/grid.js"></script>
      <script src="js/footer.js"></script>
      <script src="js/components.js"></script>
  </body>
</html>
