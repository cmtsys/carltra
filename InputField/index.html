<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanish Input</title>
  <link rel="stylesheet" href="style.css">
    <script src="lib/p5.min.js"></script>
  </head>


  <body>
<div class="container">
  <form class="component">
<svg class="svgclass" width="40px" height="40px" stroke-width="3" viewBox="0 0 24 24" fill="none" color="currentColor"><path d="M15.5 15.5L19 19M5 11a6 6 0 1012 0 6 6 0 00-12 0z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <input type='text' placeholder="What do you need?" maxlength="26"/>
    </form>
      
    </div>

    <!-- Import and execute our custom script (from the js-folder) -->
    <script src="js/myscript.js"></script>
  </body>

<script id="y8j2mt">
const form = document.querySelector('.component');
const input = form.querySelector('input');

form.addEventListener('submit', (e) => {
  e.preventDefault(); // prevent page reload

  // trigger animation
  input.classList.add('fade-out');

  // after animation, clear + reset
  setTimeout(() => {
    input.value = '';
    input.classList.remove('fade-out');
  }, 1500); // match CSS duration
});
</script>

</script>
</html>
